<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INVéSTIA Properties X myma.ai — Price Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=GFS+Didot&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#2b3f5c;--mut:#6b778a;--gold:#b8975a;--pink:#ef4f8a;--mauve:#c07a92;--line:#e3dccd;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Montserrat,Arial,sans-serif;overflow-x:hidden}
#app{width:100%;max-width:100%;margin:0 auto;min-width:0;color:var(--ink);background:var(--bg);font:14px/1.5 Montserrat,Arial,sans-serif;overflow-wrap:anywhere}
#app *,#app *::before,#app *::after,#quote *,#quote *::before,#quote *::after{box-sizing:border-box}
#app h1,#app h2,#app h3,#quote h1,#quote h2,#quote h3{font-family:'GFS Didot',Georgia,serif;font-weight:400;margin:0;text-transform:uppercase;letter-spacing:.08em}
#app header{text-align:center;padding:30px 20px 14px;position:relative}
#app .brand,#quote .brand{color:var(--gold);letter-spacing:.3em;font-size:12px;text-transform:uppercase}
#app h1{font-size:clamp(21px,3vw,32px);margin:9px 0;line-height:1.25;color:var(--ink)}
#app h1 b{color:var(--pink);font-weight:400}
#app .sub{color:var(--mut);max-width:680px;margin:0 auto;font-size:13px}
#app .lang{position:absolute;right:18px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:5px}
#app button,#app select,#app input,#app textarea{font:inherit;color:inherit;max-width:100%}
#app .lang button{border:1px solid var(--gold);background:none;padding:5px 11px;cursor:pointer;color:var(--ink);min-height:34px}
#app .lang button.on{background:var(--gold);color:#fff}
#app main{width:100%;max-width:1180px;margin:0 auto;padding:14px 20px 42px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){#app main{grid-template-columns:repeat(2,minmax(0,1fr))}#app .wide{grid-column:1/-1}}
#app section{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:20px;min-width:0;width:100%}
#app h2{font-size:16px;color:var(--gold);margin-bottom:12px;line-height:1.35}
#app label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:11px 0 5px;line-height:1.45}
#app input[type=text],#app input[type=number],#app input[type=email],#app select,#app textarea{display:block;width:100%;min-width:0;padding:10px 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px;box-shadow:none;min-height:42px}
#app .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;min-width:0}
#app .chk{display:flex;gap:8px;align-items:center;margin:7px 0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);line-height:1.45}
#app .chk input{accent-color:var(--pink);width:17px;height:17px;min-width:17px;margin:0}
#app .hint{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.6}
#app .warn{color:var(--pink)}
#app .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
#app .k{border:1px solid var(--line);padding:12px;text-align:center;min-width:0}
#app .k small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
#app .k b{font-size:clamp(16px,2vw,20px);color:var(--ink);overflow-wrap:anywhere}
#app .k.hl{background:var(--mauve);color:#fff;border-color:var(--mauve)}#app .k.hl small,#app .k.hl b{color:#fff}
#app .tw{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
#app table{border-collapse:collapse;width:100%;font-size:12px}
#app th,#app td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#app th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
#app th:first-child,#app td:first-child{text-align:left;white-space:normal;min-width:125px}
#app .pos{color:var(--pink)}#app .neg{color:#2e8b57}
#app .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border:0;padding:12px 22px;min-height:44px;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:11px;margin-top:14px;max-width:100%;white-space:normal}
#app .btn:hover{background:var(--pink);color:#fff}
#app .f{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
#app .two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){#app .two{grid-template-columns:repeat(2,minmax(0,1fr))}}
#app #gbody{min-width:0}#app #gbody td input{width:68px;min-width:58px;text-align:right;padding:6px}#app #gbody td select{width:145px;min-width:120px;padding:6px}#app #gbody td input[type=checkbox]{width:auto;min-width:0}
#app .src{font-size:10px;color:var(--mut);text-align:left!important;min-width:170px}
#app tr.tot td{font-weight:600;border-top:2px solid var(--gold)}#app tr.hl td{background:var(--pink);color:#fff;font-weight:600}
#quote{display:none;width:100%;max-width:100%;color:var(--ink);background:#fff;overflow-wrap:anywhere}
#quote h1{font-size:20px;text-align:center}
#quote .qh{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:14px}
#quote .qb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:14px;font-size:12px}
#quote h3{font-size:12px;color:var(--gold);margin-bottom:4px}
#quote .note{font-size:10px;color:#555;margin-top:12px}
#gnote,#app .src{display:none}
@media(max-width:640px){
 #app header{padding:62px 14px 14px}
 #app .lang{right:12px;top:10px}
 #app .brand{font-size:10px;letter-spacing:.22em}
 #app h1{font-size:23px}
 #app .sub{font-size:12px}
 #app main{padding:10px 12px 28px;gap:12px}
 #app section{padding:16px 13px}
 #app .g2{grid-template-columns:minmax(0,1fr);gap:0}
 #app input[type=text],#app input[type=number],#app input[type=email],#app select{font-size:16px;min-height:46px}
 #app .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 #app .k{padding:9px 6px}
 #app .k b{font-size:16px}
 #app .f{grid-template-columns:minmax(0,1fr) 64px 105px;gap:5px;font-size:11px}
 #app #gbody table{min-width:680px}
 #app .btn{width:100%;padding:12px 14px}
 #quote .qb{grid-template-columns:1fr}
}
@media(max-width:380px){#app .cards{grid-template-columns:1fr}#app .iv-never{display:none}}
@media print{
 body{background:#fff}
 body.pg #app{display:none!important}
 body.pg #quote{display:block!important;padding:0 12px;color:#2b3f5c;background:#fff}
 #quote{display:block!important}
 #quote table{width:100%;font-size:10px}
 #quote th,#quote td{white-space:normal;padding:5px}
 @page{margin:14mm}
}
</style></head><body>
<div id="app">
<header>
 <div class="lang"><button id="bEL" onclick="setL('el')">ΕΛ</button><button id="bEN" onclick="setL('en')">EN</button></div>
 <div class="brand">INVéSTIA Properties &nbsp;X&nbsp; myma.ai</div>
 <h1 data-i="title"></h1><p class="sub" data-i="sub"></p>
</header>
<main>
<section><h2 data-i="biz"></h2>
 <label data-i="pname"></label><input type="text" id="pname" oninput="calc()">
 <label data-i="legal"></label><input type="text" id="legal" oninput="calc()">
 <div class="g2"><div><label data-i="afm"></label><input type="text" id="afm" oninput="calc()"></div>
 <div><label data-i="addr"></label><input type="text" id="addr" oninput="calc()"></div></div>
 <h2 style="margin-top:18px" data-i="contact"></h2>
 <label data-i="cname"></label><input type="text" id="cname" oninput="calc()">
 <div class="g2"><div><label>Email</label><input type="email" id="cmail" oninput="calc()"></div>
 <div><label data-i="phone"></label><input type="text" id="cphone" oninput="calc()"></div></div>
</section>
<section><h2 data-i="prop"></h2>
 <label data-i="type"></label><select id="type" onchange="calc()"></select>
 <div class="g2"><div><label data-i="units"></label><input type="number" id="units" min="1" value="40" oninput="calc()"></div>
 <div><label data-i="mode"></label><select id="mode" onchange="calc()"><option value="auto"></option><option value="alc"></option><option value="bun"></option></select></div></div>
 <label data-i="sol"></label>
 <label class="chk"><input type="checkbox" id="c_chat" checked onchange="calc()"><span data-i="chat"></span></label>
 <label class="chk"><input type="checkbox" id="c_voice" checked onchange="calc()"><span data-i="voice"></span></label>
 <label class="chk"><input type="checkbox" id="c_email" checked onchange="calc()"><span data-i="email"></span></label>
 <label class="chk"><input type="checkbox" id="c_comp" onchange="calc()"><span data-i="comp"></span></label>
 <label class="chk"><input type="checkbox" id="c_out" onchange="calc()"><span data-i="out"></span></label>
 
 <hr style="border:0;border-top:1px solid var(--line)">
 <label class="chk"><input type="checkbox" id="c_spaces" onchange="calc()"><span data-i="spaces"></span></label>
 <label data-i="nsp"></label><input type="number" id="nsp" min="1" max="50" value="3" oninput="calc()">
 <label class="chk"><input type="checkbox" id="c_aiva" onchange="calc()"><span>aiva — <span data-i="aiva"></span></span></label>
 <p class="hint warn" data-i="notctr"></p>
</section>

<section class="wide"><h2 data-i="assump"></h2>
 <div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
 <div><label data-i="vinc"></label><input type="number" id="vinc" value="1000" min="0" oninput="calc()"></div>
 <div><label data-i="vmin"></label><input type="number" id="vmin" value="1000" min="0" oninput="calc()"></div>
 <div><label data-i="vrate"></label><input type="number" id="vrate" value="0.15" step="0.01" min="0" oninput="calc()"></div>
 <div><label data-i="asales"></label><input type="number" id="asales" value="0" min="0" oninput="calc()"></div>
 <div><label data-i="acomm"></label><input type="number" id="acomm" placeholder="%" step="0.5" min="0" oninput="calc()"></div>
 <div><label data-i="amin"></label><input type="number" id="amin" placeholder="€" min="0" oninput="calc()"></div>
 <div><label data-i="mopen"></label><input type="number" id="mopen" value="12" min="1" max="12" oninput="calc()"></div>
 <div><label data-i="offfee"></label><select id="offfee" onchange="calc()"><option value="all"></option><option value="open"></option></select></div>
 <div><label data-i="incg"></label><label class="chk"><input type="checkbox" id="incg" checked onchange="grow()"><span data-i="incg2"></span></label></div>
 <div><label data-i="vreg"></label><select id="vreg" onchange="vatSel()"><option value="my"></option><option value="cu"></option></select></div>
 <div><label data-i="qno"></label><input type="text" id="qno" oninput="calc()"></div>
 <div><label data-i="qvalid"></label><input type="number" id="qvalid" value="30" min="0" oninput="calc()"></div>
 <div><label data-i="qnot"></label><input type="number" id="qnot" min="0" oninput="calc()"></div>
 <div style="grid-column:1/-1"><label data-i="qpay"></label><input type="text" id="qpay" oninput="calc()"></div>
 <div><label data-i="vatp"></label><input type="number" id="vat" value="24" min="0" step="0.5" oninput="calc()"></div>
 <div><label data-i="vatsec"></label><label class="chk"><input type="checkbox" id="vaton" onchange="calc()"><span data-i="vaton"></span></label></div>
 <div><label data-i="disc"></label><label class="chk"><input type="checkbox" id="dison" onchange="calc()"><span data-i="dison"></span></label><input type="number" id="disp" value="10" min="0" max="100" step="0.5" oninput="calc()"></div>
 <div><label data-i="discsc"></label><label class="chk"><input type="checkbox" id="dis_s" checked onchange="calc()"><span data-i="dis_s"></span></label><label class="chk"><input type="checkbox" id="dis_m" checked onchange="calc()"><span data-i="dis_m"></span></label></div>
 </div><p class="hint" data-i="ahint"></p>
</section>
<section class="wide"><h2 data-i="res"></h2><div id="out"></div>
 <div id="offers" style="display:none"></div>
 <button class="btn" onclick="window.print()" data-i="pdf"></button>
 <p class="hint" data-i="pdfh"></p></section>
<section class="wide"><h2 data-i="cmp"></h2><div class="tw" id="cmp"></div><p class="hint" data-i="cmph"></p></section>


<section class="wide" id="gsec"><h2 id="gh"></h2><div id="gbody"></div></section>
</main></div>

function offLoad(){const ks=offGet(),o=ks&&ks[$('osel').value];if(!o)return;for(const k in o){if(k.endsWith('#d'))continue;const e=$(k);if(!e)continue;if(e.type=='checkbox')e.checked=o[k];else e.value=o[k];if(e.tagName=='TEXTAREA'&&o[k+'#d'])e.dataset.d=1}calc();$('omsg').textContent=P('Loaded|Φορτώθηκε')}
function offDel(){const ks=offGet(),k=$('osel').value;if(!ks||!ks[k])return;delete ks[k];try{localStorage.setItem(OK,JSON.stringify(ks))}catch(e){}offUI()}
function impData(){try{const o=JSON.parse($('impt').value.replace(/^\s*INV1:/,'')),mp={pname:'pname',legal:'legal',afm:'afm',addr:'addr',cname:'cname',cmail:'cmail',cphone:'cphone',rooms:'units',mopen:'mopen',occ:'g_occ',adr:'g_adr',ota:'g_ota',alos:'g_alos',conv:'g_conv',hr:'g_hr',fcost:'g_fcost',miss:'g_miss',gv:'g_gv'};let c=0;
for(const k in mp){if(o[k]!==undefined&&o[k]!==''){const e=$(mp[k]);if(e){e.value=o[k];c++;if(mp[k].startsWith('g_')){const sl=$('g_s_'+mp[k].slice(2));if(sl)sl.value='h'}}}}
calc();$('impm').textContent=P('Imported fields: |Εισήχθησαν πεδία: ')+c}catch(e){$('impm').textContent=P('Could not read the data.|Δεν διαβάστηκαν τα δεδομένα.')}}
$('qno').value='INV-'+new Date().toISOString().slice(0,10).replace(/-/g,'');
['acomm','amin','dison','disp','dis_s','dis_m','qno','qvalid','qnot','qpay','vreg','vat','vaton'].forEach(id=>{const e=$(id);if(e)e.closest('div').style.display='none'});
$('qvalid').value=0;
const ah=document.querySelector('[data-i=ahint]');if(ah)ah.style.display='none';
setL('el');
</script></body></html>
